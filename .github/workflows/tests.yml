name: Harbor CLI Tests

on:
  push:
    branches: [feature-fin-v2, main]
  pull_request:

jobs:
  harbor-tests:
    name: Swift Tests (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Harbor CLI unit tests
        run: swift test --configuration debug
